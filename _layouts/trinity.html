<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --ink: #151515;
      --ink-soft: #343434;
      --muted: #686f73;
      --paper: #fbfbf7;
      --surface: #ffffff;
      --line: rgba(21, 21, 21, 0.12);
      --teal: #007f73;
      --mint: #dff8ef;
      --coral: #ff684d;
      --amber: #f2b84b;
      --violet: #7f63d6;
      --shadow: 0 22px 70px rgba(21, 21, 21, 0.14);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(251, 251, 247, 0.94), rgba(251, 251, 247, 1) 42%),
        repeating-linear-gradient(90deg, rgba(21, 21, 21, 0.035) 0, rgba(21, 21, 21, 0.035) 1px, transparent 1px, transparent 96px);
      line-height: 1.65;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(21, 21, 21, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(21, 21, 21, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, transparent 0, black 18%, black 70%, transparent 100%);
      z-index: -1;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .trinity-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(251, 251, 247, 0.78);
      border-bottom: 1px solid rgba(21, 21, 21, 0.08);
      backdrop-filter: blur(18px);
    }

    .trinity-nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-lockup {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1rem;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid var(--ink);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      background: var(--surface);
    }

    .brand-mark span {
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }

    .brand-mark span:nth-child(3n) {
      border-right: 0;
    }

    .brand-mark span:nth-last-child(-n+3) {
      border-bottom: 0;
    }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(5),
    .brand-mark span:nth-child(8) {
      background: var(--teal);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .nav-links a {
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .nav-links a:hover {
      color: var(--teal);
      border-color: var(--teal);
    }

    .hero {
      min-height: 88vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: var(--ink);
    }

    .hero-media {
      position: absolute;
      inset: 0;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.88) contrast(1.02);
      transform: scale(1.02);
      animation: settle 1600ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10, 12, 12, 0.9) 0%, rgba(10, 12, 12, 0.58) 44%, rgba(10, 12, 12, 0.12) 100%),
        linear-gradient(180deg, rgba(10, 12, 12, 0.35) 0%, rgba(10, 12, 12, 0.12) 48%, rgba(10, 12, 12, 0.72) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 132px 24px 70px;
      color: #fff;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--coral);
    }

    .hero h1 {
      margin: 0;
      max-width: 980px;
      font-size: 5rem;
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: 0;
    }

    .hero-subtitle {
      max-width: 840px;
      margin: 24px 0 0;
      font-size: 1.2rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.88);
    }

    .authors {
      max-width: 980px;
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.98rem;
    }

    .authors strong {
      color: #fff;
      font-weight: 700;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-weight: 750;
      font-size: 0.92rem;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .action::after {
      content: "->";
      margin-left: 10px;
      color: var(--amber);
    }

    .action:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .action-muted {
      opacity: 0.68;
      cursor: default;
    }

    .action-muted::after {
      content: "";
      margin: 0;
    }

    .section {
      max-width: var(--max);
      margin: 0 auto;
      padding: 94px 24px;
    }

    .section-wide {
      max-width: 1380px;
    }

    .section-band {
      max-width: none;
      margin: 0;
      background: #111;
      color: #fff;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section-band .section {
      padding-top: 92px;
      padding-bottom: 92px;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 0.72fr) minmax(280px, 1fr);
      gap: 48px;
      align-items: end;
      margin-bottom: 42px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .section-band .eyebrow {
      color: var(--amber);
    }

    .section-title {
      margin: 0;
      font-size: 2.6rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .section-copy {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.78;
      text-align: justify;
    }

    .section-band .section-copy {
      color: rgba(255, 255, 255, 0.72);
    }

    .abstract-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 44px;
      align-items: start;
    }

    .abstract-text {
      font-size: 1.06rem;
      color: var(--ink-soft);
      text-align: justify;
    }

    .abstract-text p {
      margin: 0 0 18px;
    }

    .signal-list {
      display: grid;
      gap: 10px;
    }

    .signal {
      padding: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 38px rgba(21, 21, 21, 0.06);
      border-radius: 8px;
    }

    .signal-value {
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1;
      color: var(--teal);
    }

    .signal-label {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .feature-card {
      min-height: 228px;
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(21, 21, 21, 0.07);
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 127, 115, 0.42);
      box-shadow: 0 26px 70px rgba(21, 21, 21, 0.12);
    }

    .feature-index {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin-bottom: 24px;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
      font-size: 0.82rem;
    }

    .feature-card:nth-child(2) .feature-index {
      background: var(--coral);
    }

    .feature-card:nth-child(3) .feature-index {
      background: var(--violet);
    }

    .feature-card:nth-child(4) .feature-index {
      background: var(--amber);
      color: var(--ink);
    }

    .feature-card h3 {
      margin: 0 0 12px;
      font-size: 1.12rem;
      line-height: 1.22;
    }

    .feature-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .figure-stage {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .figure-stage img {
      width: 100%;
      background: #fff;
    }

    .caption {
      border-top: 1px solid var(--line);
      padding: 15px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      background: rgba(255, 255, 255, 0.82);
    }

    .figure-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .workflow-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
    }

    .workflow-node {
      padding: 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      min-height: 174px;
    }

    .workflow-node h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      color: #fff;
    }

    .workflow-node p {
      margin: 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.94rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 0.84fr 1.16fr;
      gap: 20px;
      align-items: stretch;
    }

    .metric-board {
      display: grid;
      gap: 12px;
    }

    .metric {
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 8px;
    }

    .metric:nth-child(2) {
      border-left-color: var(--coral);
    }

    .metric:nth-child(3) {
      border-left-color: var(--violet);
    }

    .metric:nth-child(4) {
      border-left-color: var(--amber);
    }

    .metric strong {
      display: block;
      font-size: 1.4rem;
      line-height: 1;
      margin-bottom: 8px;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .citation {
      margin: 0;
      padding: 22px;
      overflow-x: auto;
      background: #111;
      color: #f4f4ef;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.58;
    }

    .trinity-footer {
      padding: 50px 24px;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
    }

    @keyframes settle {
      from {
        transform: scale(1.08);
        opacity: 0.78;
      }
      to {
        transform: scale(1.02);
        opacity: 1;
      }
    }

    @media (max-width: 980px) {
      .hero h1 {
        font-size: 3.5rem;
      }

      .section-head,
      .abstract-grid,
      .results-grid {
        grid-template-columns: 1fr;
      }

      .feature-grid,
      .workflow-map {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .nav-links {
        display: none;
      }
    }

    @media (max-width: 680px) {
      .hero {
        min-height: 86vh;
      }

      .hero h1 {
        font-size: 2.62rem;
        line-height: 1.02;
      }

      .hero-subtitle {
        font-size: 1rem;
      }

      .section {
        padding: 70px 18px;
      }

      .section-title {
        font-size: 2rem;
      }

      .feature-grid,
      .workflow-map,
      .figure-row {
        grid-template-columns: 1fr;
      }

      .abstract-text,
      .section-copy {
        text-align: left;
      }

      .action {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav class="trinity-nav" aria-label="Trinity navigation">
    <div class="trinity-nav-inner">
      <a href="/" class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <span>Trinity</span>
      </a>
      <div class="nav-links">
        <a href="#abstract">Abstract</a>
        <a href="#method">Framework</a>
        <a href="#project">Consistency</a>
        <a href="#results">Results</a>
        <a href="#citation">Citation</a>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="trinity-footer">
    Trinity Project. Draft website preview for a work in progress manuscript.
  </footer>
</body>
</html>
