<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --ink: #111314;
      --ink-2: #2f3638;
      --muted: #687176;
      --paper: #fbfaf6;
      --paper-2: #f1eee7;
      --surface: #ffffff;
      --line: rgba(17, 19, 20, 0.12);
      --green: #18c37e;
      --green-dark: #087955;
      --blue: #2f6fe4;
      --violet: #8a63e6;
      --coral: #ff6b4a;
      --amber: #f2b84b;
      --shadow: 0 24px 80px rgba(17, 19, 20, 0.12);
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      letter-spacing: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(24, 195, 126, 0.18), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(47, 111, 228, 0.12), transparent 30%),
        linear-gradient(180deg, var(--paper) 0%, #f8f5ee 44%, var(--paper) 100%);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(17, 19, 20, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 19, 20, 0.035) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(to bottom, black 0%, black 72%, transparent 100%);
      z-index: -1;
    }

    a { color: inherit; }
    img { display: block; max-width: 100%; }

    body:not(.lang-zh) .lang-zh { display: none !important; }
    body.lang-zh .lang-en { display: none !important; }
    body.lang-zh .lang-zh { display: inline !important; }
    body.lang-zh .hero-title-line.lang-zh { display: block !important; }

    .trinity-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent;
      border-bottom: 1px solid transparent;
      box-shadow: none;
      transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .trinity-nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
      transition: max-width 260ms ease, margin-top 260ms ease, padding 260ms ease, border-color 260ms ease, background 260ms ease, box-shadow 260ms ease;
    }

    .trinity-nav:not(.scrolled),
    .trinity-nav:not(.scrolled) .trinity-nav-inner {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .trinity-nav.scrolled .trinity-nav-inner {
      max-width: 1320px;
      margin-top: 12px;
      padding: 10px 18px;
      border-color: rgba(17, 19, 20, 0.1);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 60px rgba(17, 19, 20, 0.14);
      backdrop-filter: blur(20px);
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 860;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 1.5px solid var(--ink);
      background: #fff;
      box-shadow: 4px 4px 0 var(--green);
    }

    .brand-mark span {
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }

    .brand-mark span:nth-child(3n) { border-right: 0; }
    .brand-mark span:nth-last-child(-n+3) { border-bottom: 0; }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(5),
    .brand-mark span:nth-child(8) {
      background: var(--green);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      transition: border-color 220ms ease, background 220ms ease;
    }

    .trinity-nav.scrolled .nav-links {
      border-color: transparent;
      background: transparent;
    }

    .nav-links a {
      min-height: 32px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--ink-2);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 740;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-links a:hover {
      color: var(--ink);
      background: var(--paper-2);
    }

    .nav-cta {
      min-height: 38px;
      padding: 8px 14px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 840;
      box-shadow: 4px 4px 0 var(--green);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .language-toggle {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid rgba(17, 19, 20, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--ink);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 820;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .language-toggle:hover {
      border-color: rgba(17, 19, 20, 0.22);
      background: #fff;
      transform: translateY(-1px);
    }

    .nav-cta:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--green);
    }

    .hero {
      padding: 124px 22px 42px;
    }

    .hero-inner {
      max-width: 1480px;
      margin: 0 auto;
      text-align: center;
    }

    .product-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid rgba(17, 19, 20, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--ink-2);
      font-size: 0.9rem;
      font-weight: 760;
      box-shadow: 0 12px 36px rgba(17, 19, 20, 0.06);
      animation: rise-in 620ms ease both;
    }

    .product-pill::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(24, 195, 126, 0.13);
    }

    .hero h1 {
      max-width: 1080px;
      margin: 24px auto 0;
      font-size: clamp(3.45rem, 9vw, 8.25rem);
      line-height: 0.89;
      font-weight: 930;
      letter-spacing: 0;
      animation: rise-in 720ms 70ms ease both;
    }

    .hero-title-line { display: block; }
    .hero-title-accent { color: var(--green-dark); }

    .hero-copy {
      max-width: 830px;
      margin: 28px auto 0;
      color: var(--ink-2);
      font-size: clamp(1.05rem, 2vw, 1.26rem);
      line-height: 1.68;
      animation: rise-in 760ms 130ms ease both;
    }

    .author-line {
      max-width: 960px;
      margin: 22px auto 0;
      color: var(--ink);
      font-size: 0.98rem;
      animation: rise-in 760ms 170ms ease both;
    }

    .author-line sup,
    .affiliation-line sup {
      font-size: 0.68em;
      line-height: 0;
      vertical-align: super;
    }

    .affiliation-line {
      max-width: 980px;
      margin: 8px auto 0;
      color: var(--ink);
      font-size: 0.92rem;
      animation: rise-in 760ms 185ms ease both;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
      animation: rise-in 760ms 210ms ease both;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 18px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-weight: 850;
      box-shadow: 4px 4px 0 rgba(17, 19, 20, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 rgba(17, 19, 20, 0.16);
    }

    .button-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 5px 5px 0 var(--green);
    }

    .button-primary:hover { box-shadow: 8px 8px 0 var(--green); }
    .button[aria-disabled="true"] { opacity: 0.54; pointer-events: none; }

    .hero-visual {
      max-width: 1080px;
      margin: 58px auto 0;
      animation: visual-in 900ms 240ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .hero-visual img,
    .paper-figure img {
      width: 100%;
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .section {
      max-width: var(--max);
      margin: 0 auto;
      padding: 82px 22px;
    }

    .section-wide { max-width: 1320px; }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(320px, 1fr);
      gap: 48px;
      align-items: end;
      margin-bottom: 34px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green-dark);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-title {
      margin: 0;
      font-size: clamp(2.05rem, 4.6vw, 4.05rem);
      line-height: 1;
      font-weight: 930;
      letter-spacing: 0;
    }

    .section-copy {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.78;
    }

    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 660ms ease, transform 660ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stat-line {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-top: 34px;
    }

    .stat {
      position: relative;
      padding: 18px 0 8px;
      border-top: 1.5px solid var(--line);
    }

    .stat strong {
      display: block;
      color: var(--green-dark);
      font-size: 2.1rem;
      line-height: 1;
      font-weight: 930;
    }

    .stat > span {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .capability {
      padding-top: 18px;
      border-top: 1.5px solid var(--line);
      transition: transform 220ms ease, border-color 220ms ease;
    }

    .capability:hover {
      transform: translateY(-5px);
      border-color: var(--green);
    }

    .capability-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 22px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
      font-size: 0.82rem;
    }

    .capability:nth-child(2) .capability-index { background: var(--blue); }
    .capability:nth-child(3) .capability-index { background: var(--violet); }
    .capability:nth-child(4) .capability-index { background: var(--coral); }

    .capability h3 {
      margin: 0 0 10px;
      font-size: 1.14rem;
      line-height: 1.2;
    }

    .capability p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .showcase-wall {
      width: min(100%, 1420px);
      margin: 56px auto 0;
      columns: 4 260px;
      column-gap: 14px;
      text-align: left;
    }

    .showcase-card {
      position: relative;
      display: block;
      width: 100%;
      margin: 0 0 14px;
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      overflow: hidden;
      break-inside: avoid;
      cursor: zoom-in;
      box-shadow: 0 18px 56px rgba(17, 19, 20, 0.12);
      transform: translateZ(0);
      transition: transform 240ms ease, box-shadow 240ms ease;
    }

    .showcase-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 86px rgba(17, 19, 20, 0.18);
    }

    .showcase-card img {
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #fff;
      transition: transform 420ms ease;
    }

    .showcase-card:hover img {
      transform: scale(1.035);
    }

    .showcase-card::after {
      content: "Click to enlarge";
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      font-size: 0.74rem;
      font-weight: 820;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 200ms ease, transform 200ms ease;
      backdrop-filter: blur(12px);
    }

    body.lang-zh .showcase-card::after { content: "点击放大"; }

    .showcase-card:hover::after {
      opacity: 1;
      transform: translateY(0);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      padding: 34px;
      background: rgba(8, 9, 10, 0.82);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      backdrop-filter: blur(18px);
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: min(94vw, 1500px);
      max-height: 88vh;
      border-radius: 18px;
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.45);
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .paper-figure {
      margin: 0;
      transition: transform 260ms ease;
    }

    .paper-figure:hover { transform: translateY(-4px); }

    .figure-caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .caption-tag {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .figure-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      margin-top: 22px;
      align-items: start;
    }

    .process-track {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin: 36px 0 4px;
      border-top: 1.5px solid var(--line);
    }

    .process-step {
      position: relative;
      padding: 28px 22px 0 0;
    }

    .process-step::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      transform: scale(0.8);
      transition: transform 220ms ease;
    }

    .process-step:hover::before { transform: scale(1.22); }

    .process-step small {
      display: block;
      margin-bottom: 8px;
      color: var(--green-dark);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .process-step h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .process-step p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .results-layout {
      display: grid;
      grid-template-columns: 0.72fr 1.28fr;
      gap: 34px;
      align-items: start;
    }

    .result-stack {
      display: grid;
      gap: 0;
      border-top: 1.5px solid var(--line);
    }

    .result-item {
      padding: 18px 0;
      border-bottom: 1.5px solid var(--line);
    }

    .result-item strong {
      display: block;
      margin-bottom: 7px;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 930;
    }

    .result-item span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mini-gallery {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      margin-top: 34px;
      align-items: start;
    }

    .citation {
      margin: 0;
      padding: 22px;
      overflow-x: auto;
      border-radius: 18px;
      background: var(--ink);
      color: #f8f7f1;
      box-shadow: 8px 8px 0 var(--green);
      font-size: 0.9rem;
      line-height: 1.58;
    }

    .trinity-footer {
      padding: 50px 22px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes visual-in {
      from { opacity: 0; transform: translateY(34px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 1060px) {
      .nav-links { display: none; }
      .section-head,
      .results-layout,
      .mini-gallery { grid-template-columns: 1fr; }
      .stat-line,
      .capability-grid,
      .process-track { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .showcase-wall { columns: 3 220px; }
      .process-track { row-gap: 24px; }
    }

    @media (max-width: 720px) {
      .hero { padding-top: 104px; }
      .hero h1 { font-size: clamp(3rem, 17vw, 5rem); }
      .hero-copy { font-size: 1rem; }
      .section { padding: 66px 18px; }
      .stat-line,
      .capability-grid,
      .process-track,
      .figure-row { grid-template-columns: 1fr; }
      .showcase-wall {
        columns: 2 150px;
        column-gap: 10px;
        margin-top: 42px;
      }
      .showcase-card { margin-bottom: 10px; border-radius: 14px; }
      .figure-caption {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }
      .hero-actions .button { width: 100%; }
      .trinity-nav-inner {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav class="trinity-nav" aria-label="Trinity navigation">
    <div class="trinity-nav-inner">
      <a href="/" class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <span>Trinity</span>
      </a>
      <div class="nav-links">
        <a href="#overview"><span class="lang-en">Overview</span><span class="lang-zh">概览</span></a>
        <a href="#framework"><span class="lang-en">Framework</span><span class="lang-zh">框架</span></a>
        <a href="#project"><span class="lang-en">Project</span><span class="lang-zh">项目</span></a>
        <a href="#knowledge"><span class="lang-en">Knowledge</span><span class="lang-zh">知识</span></a>
        <a href="#results"><span class="lang-en">Results</span><span class="lang-zh">结果</span></a>
      </div>
      <button class="language-toggle" type="button" data-lang-toggle aria-label="Switch language">
        <span class="lang-en">中文</span>
        <span class="lang-zh">EN</span>
      </button>
      <a class="nav-cta" href="/mypaper/trinity/trinity_20260702_110124.pdf">
        <span class="lang-en">Paper</span>
        <span class="lang-zh">论文</span>
      </a>
    </div>
  </nav>

  {{ content }}

  <footer class="trinity-footer">
    <span class="lang-en">Trinity Project. Work in progress manuscript and project page.</span>
    <span class="lang-zh">Trinity 项目页。论文与页面仍在持续完善中。</span>
  </footer>

  <div class="lightbox" id="trinity-lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close enlarged image">&times;</button>
    <img src="" alt="">
  </div>

  <script>
    const nav = document.querySelector('.trinity-nav');
    const updateNav = () => {
      if (window.scrollY > 28) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    };
    updateNav();
    window.addEventListener('scroll', updateNav, { passive: true });

    const langToggle = document.querySelector('[data-lang-toggle]');
    const setLanguage = (language) => {
      const useChinese = language === 'zh';
      document.body.classList.toggle('lang-zh', useChinese);
      document.documentElement.lang = useChinese ? 'zh-CN' : 'en';
      langToggle?.setAttribute('aria-pressed', String(useChinese));
      langToggle?.setAttribute('aria-label', useChinese ? '切换语言' : 'Switch language');
      document.querySelector('.trinity-nav')?.setAttribute('aria-label', useChinese ? 'Trinity 导航' : 'Trinity navigation');
      document.querySelector('.lightbox-close')?.setAttribute('aria-label', useChinese ? '关闭放大图片' : 'Close enlarged image');
      try {
        window.localStorage.setItem('trinity-language', useChinese ? 'zh' : 'en');
      } catch (error) {
        // Ignore storage errors in private browsing contexts.
      }
    };
    let savedLanguage = 'en';
    try {
      savedLanguage = window.localStorage.getItem('trinity-language') || 'en';
    } catch (error) {
      savedLanguage = 'en';
    }
    setLanguage(savedLanguage);
    langToggle?.addEventListener('click', () => {
      setLanguage(document.body.classList.contains('lang-zh') ? 'en' : 'zh');
    });

    const revealItems = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.16 });
    revealItems.forEach((item) => revealObserver.observe(item));

    const lightbox = document.getElementById('trinity-lightbox');
    const lightboxImage = lightbox.querySelector('img');
    const closeLightbox = () => {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
      lightboxImage.alt = '';
    };
    document.querySelectorAll('[data-lightbox-src]').forEach((button) => {
      button.addEventListener('click', () => {
        lightboxImage.src = button.dataset.lightboxSrc;
        lightboxImage.alt = button.querySelector('img')?.alt || 'Trinity generated design';
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox || event.target.classList.contains('lightbox-close')) {
        closeLightbox();
      }
    });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
