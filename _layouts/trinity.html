<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --ink: #111314;
      --ink-2: #2d3336;
      --muted: #687176;
      --paper: #fbfaf6;
      --paper-2: #f3f0e9;
      --surface: #ffffff;
      --line: rgba(17, 19, 20, 0.12);
      --line-strong: rgba(17, 19, 20, 0.22);
      --green: #18c37e;
      --green-dark: #087955;
      --blue: #2d6cdf;
      --violet: #8b5cf6;
      --coral: #ff6a4a;
      --amber: #f5b84b;
      --shadow-sm: 0 12px 36px rgba(17, 19, 20, 0.08);
      --shadow-md: 0 26px 90px rgba(17, 19, 20, 0.16);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      letter-spacing: 0;
      background:
        linear-gradient(180deg, rgba(251, 250, 246, 0.96) 0%, rgba(251, 250, 246, 1) 38%, rgba(243, 240, 233, 1) 100%),
        linear-gradient(90deg, rgba(17, 19, 20, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(17, 19, 20, 0.035) 1px, transparent 1px);
      background-size: auto, 96px 96px, 96px 96px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .trinity-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(17, 19, 20, 0.08);
      background: rgba(251, 250, 246, 0.78);
      backdrop-filter: blur(18px);
    }

    .trinity-nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 850;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 1.5px solid var(--ink);
      background: #fff;
      box-shadow: 4px 4px 0 var(--green);
    }

    .brand-mark span {
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }

    .brand-mark span:nth-child(3n) {
      border-right: 0;
    }

    .brand-mark span:nth-last-child(-n+3) {
      border-bottom: 0;
    }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(5),
    .brand-mark span:nth-child(8) {
      background: var(--green);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border: 1px solid rgba(17, 19, 20, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 24px rgba(17, 19, 20, 0.05);
    }

    .nav-links a {
      min-height: 32px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--ink-2);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 720;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .nav-links a:hover {
      color: var(--ink);
      background: var(--paper-2);
      transform: translateY(-1px);
    }

    .nav-cta {
      min-height: 38px;
      padding: 8px 14px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 820;
      box-shadow: 4px 4px 0 var(--green);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .nav-cta:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--green);
    }

    .hero {
      position: relative;
      padding: 128px 22px 74px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 72px 0 auto;
      height: 480px;
      background:
        linear-gradient(90deg, rgba(24, 195, 126, 0.16), transparent 32%, rgba(45, 108, 223, 0.12) 68%, transparent),
        repeating-linear-gradient(135deg, rgba(17, 19, 20, 0.045) 0 1px, transparent 1px 18px);
      transform: skewY(-5deg);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      max-width: var(--max);
      margin: 0 auto;
      text-align: center;
    }

    .product-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid rgba(17, 19, 20, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink-2);
      font-size: 0.9rem;
      font-weight: 760;
      box-shadow: var(--shadow-sm);
      animation: rise-in 620ms ease both;
    }

    .product-pill::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(24, 195, 126, 0.13);
    }

    .hero h1 {
      max-width: 1080px;
      margin: 24px auto 0;
      font-size: clamp(3.5rem, 9vw, 8.5rem);
      line-height: 0.88;
      font-weight: 930;
      letter-spacing: 0;
      animation: rise-in 720ms 80ms ease both;
    }

    .hero-title-line {
      display: block;
    }

    .hero-title-accent {
      color: var(--green-dark);
    }

    .hero-copy {
      max-width: 830px;
      margin: 28px auto 0;
      color: var(--ink-2);
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      line-height: 1.68;
      animation: rise-in 760ms 140ms ease both;
    }

    .author-line {
      max-width: 960px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 0.98rem;
      animation: rise-in 760ms 180ms ease both;
    }

    .author-line strong {
      color: var(--ink);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
      animation: rise-in 760ms 220ms ease both;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 11px 18px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--surface);
      text-decoration: none;
      font-weight: 850;
      color: var(--ink);
      box-shadow: 4px 4px 0 rgba(17, 19, 20, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 rgba(17, 19, 20, 0.16);
      background: #fff;
    }

    .button-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 5px 5px 0 var(--green);
    }

    .button-primary:hover {
      background: var(--ink);
      box-shadow: 8px 8px 0 var(--green);
    }

    .button[aria-disabled="true"] {
      opacity: 0.55;
      pointer-events: none;
    }

    .hero-product {
      position: relative;
      max-width: 1120px;
      margin: 56px auto 0;
      animation: product-in 900ms 240ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .window-frame {
      position: relative;
      border: 1.5px solid var(--ink);
      border-radius: 18px;
      background: #f7f5ef;
      box-shadow: var(--shadow-md), 10px 10px 0 rgba(17, 19, 20, 0.1);
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .window-top {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(17, 19, 20, 0.16);
    }

    .dot:nth-child(1) { background: var(--coral); }
    .dot:nth-child(2) { background: var(--amber); }
    .dot:nth-child(3) { background: var(--green); }

    .window-path {
      margin-left: 10px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
    }

    .window-frame img {
      width: 100%;
      background: #fff;
    }

    .float-panel {
      position: absolute;
      display: grid;
      gap: 7px;
      min-width: 174px;
      padding: 14px;
      border: 1px solid rgba(17, 19, 20, 0.14);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow-sm);
      text-align: left;
      animation: drift 5.4s ease-in-out infinite;
    }

    .float-panel strong {
      font-size: 0.9rem;
    }

    .float-panel span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .panel-left {
      left: -32px;
      top: 18%;
    }

    .panel-right {
      right: -26px;
      bottom: 16%;
      animation-delay: -1.7s;
    }

    .section {
      position: relative;
      max-width: var(--max);
      margin: 0 auto;
      padding: 86px 22px;
    }

    .section-wide {
      max-width: 1320px;
    }

    .section-band {
      max-width: none;
      margin: 0;
      background: var(--ink);
      color: #fff;
      overflow: hidden;
    }

    .section-band .section {
      padding-top: 96px;
      padding-bottom: 96px;
    }

    .section-band::before {
      content: "";
      position: absolute;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 0.82fr) minmax(320px, 1fr);
      gap: 48px;
      align-items: end;
      margin-bottom: 34px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green-dark);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-band .eyebrow {
      color: var(--green);
    }

    .section-title {
      margin: 0;
      font-size: clamp(2.1rem, 4.8vw, 4.2rem);
      line-height: 0.98;
      font-weight: 930;
      letter-spacing: 0;
    }

    .section-copy {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.78;
    }

    .section-band .section-copy {
      color: rgba(255, 255, 255, 0.72);
    }

    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 620ms ease, transform 620ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }

    .metric-tile {
      min-height: 148px;
      padding: 18px;
      border: 1.5px solid var(--ink);
      border-radius: 18px;
      background: #fff;
      box-shadow: 6px 6px 0 rgba(17, 19, 20, 0.08);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .metric-tile:hover {
      transform: translate(-2px, -2px);
      box-shadow: 9px 9px 0 rgba(17, 19, 20, 0.12);
    }

    .metric-tile strong {
      display: block;
      margin-bottom: 12px;
      color: var(--green-dark);
      font-size: 2.4rem;
      line-height: 0.95;
      font-weight: 930;
    }

    .metric-tile span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .capability {
      min-height: 246px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-sm);
      transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
    }

    .capability:hover {
      transform: translateY(-8px);
      background: #fff;
      border-color: rgba(24, 195, 126, 0.44);
    }

    .capability-index {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-bottom: 30px;
      border-radius: 12px;
      color: #fff;
      background: var(--ink);
      font-weight: 900;
      box-shadow: 4px 4px 0 rgba(17, 19, 20, 0.12);
    }

    .capability:nth-child(2) .capability-index { background: var(--blue); }
    .capability:nth-child(3) .capability-index { background: var(--violet); }
    .capability:nth-child(4) .capability-index { background: var(--coral); }

    .capability h3 {
      margin: 0 0 10px;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .capability p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .figure-stage {
      border: 1.5px solid var(--ink);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow-md), 8px 8px 0 rgba(17, 19, 20, 0.08);
      overflow: hidden;
      transition: transform 260ms ease, box-shadow 260ms ease;
    }

    .figure-stage:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md), 12px 12px 0 rgba(17, 19, 20, 0.11);
    }

    .figure-stage img {
      width: 100%;
      background: #fff;
    }

    .figure-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      background: #fff;
    }

    .caption-tag {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid rgba(17, 19, 20, 0.14);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 820;
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .figure-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 22px;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 34px 0;
    }

    .process-step {
      position: relative;
      min-height: 182px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
      transition: transform 220ms ease, border-color 220ms ease, background 220ms ease;
    }

    .process-step:hover {
      transform: translateY(-6px);
      border-color: rgba(24, 195, 126, 0.52);
      background: rgba(255, 255, 255, 0.11);
    }

    .process-step::before {
      content: attr(data-step);
      position: absolute;
      right: 16px;
      top: 8px;
      color: rgba(255, 255, 255, 0.13);
      font-size: 3.8rem;
      line-height: 1;
      font-weight: 930;
    }

    .process-step h3 {
      position: relative;
      margin: 0 0 10px;
      color: #fff;
      font-size: 1.06rem;
    }

    .process-step p {
      position: relative;
      margin: 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.92rem;
    }

    .results-layout {
      display: grid;
      grid-template-columns: 0.76fr 1.24fr;
      gap: 20px;
      align-items: stretch;
    }

    .result-stack {
      display: grid;
      gap: 12px;
    }

    .result-item {
      padding: 18px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow-sm);
    }

    .result-item:nth-child(2) { border-left-color: var(--blue); }
    .result-item:nth-child(3) { border-left-color: var(--violet); }
    .result-item:nth-child(4) { border-left-color: var(--coral); }

    .result-item strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.7rem;
      line-height: 1;
      font-weight: 930;
    }

    .result-item span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mini-gallery {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      margin-top: 20px;
    }

    .citation {
      margin: 0;
      padding: 22px;
      overflow-x: auto;
      border: 1.5px solid var(--ink);
      border-radius: 20px;
      background: var(--ink);
      color: #f8f7f1;
      box-shadow: 8px 8px 0 var(--green);
      font-size: 0.9rem;
      line-height: 1.58;
    }

    .trinity-footer {
      padding: 50px 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes product-in {
      from {
        opacity: 0;
        transform: translateY(32px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes drift {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @media (max-width: 1060px) {
      .nav-links {
        display: none;
      }

      .section-head,
      .results-layout,
      .mini-gallery {
        grid-template-columns: 1fr;
      }

      .metrics-strip,
      .capability-grid,
      .process-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .float-panel {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .hero {
        padding-top: 104px;
      }

      .hero h1 {
        font-size: clamp(3.1rem, 17vw, 5.1rem);
      }

      .hero-copy {
        font-size: 1rem;
      }

      .section {
        padding: 68px 18px;
      }

      .metrics-strip,
      .capability-grid,
      .process-grid,
      .figure-row {
        grid-template-columns: 1fr;
      }

      .window-path {
        display: none;
      }

      .figure-caption {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .hero-actions .button {
        width: 100%;
      }

      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .trinity-nav-inner {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav class="trinity-nav" aria-label="Trinity navigation">
    <div class="trinity-nav-inner">
      <a href="/" class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <span>Trinity</span>
      </a>
      <div class="nav-links">
        <a href="#overview">Overview</a>
        <a href="#framework">Framework</a>
        <a href="#project">Project</a>
        <a href="#knowledge">Knowledge</a>
        <a href="#results">Results</a>
      </div>
      <a class="nav-cta" href="/mypaper/trinity/trinity_20260702_110124.pdf">Paper</a>
    </div>
  </nav>

  {{ content }}

  <footer class="trinity-footer">
    Trinity Project. Work in progress manuscript and project page.
  </footer>

  <script>
    const revealItems = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.18 });
    revealItems.forEach((item) => revealObserver.observe(item));

    const heroProduct = document.querySelector('.hero-product');
    window.addEventListener('scroll', () => {
      if (!heroProduct || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const offset = Math.min(window.scrollY * 0.035, 18);
      heroProduct.style.transform = `translateY(${offset}px)`;
    }, { passive: true });
  </script>
</body>
</html>
